name: pramana

services:
  app:
    build: .
    env_file:
      - path: .env
        required: false
      - path: .env.local
        required: false
    environment:
      DATA_DIR: /data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:${PRAMANA_PORT:-3000}:3000"
    volumes:
      - pramana-data:/data
    init: true
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/rencana').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 3

  tunnel:
    image: cloudflare/cloudflared:latest
    command: tunnel --no-autoupdate --protocol http2 --url http://app:3000
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pramana-data:
    name: ${PRAMANA_VOLUME:-pramana-data}
